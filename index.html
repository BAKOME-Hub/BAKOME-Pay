<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💸 BAKOME Pay v3.0 - With Webacy Security</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0a0a1a 0%, #1a1a2e 100%);
            color: #e2e8f0;
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        .header {
            text-align: center;
            padding: 40px 20px;
            background: rgba(124, 58, 237, 0.1);
            border-radius: 12px;
            margin-bottom: 40px;
        }
        .header h1 { font-size: 2.5em; margin-bottom: 10px; }
        .header p { color: #64748b; font-size: 1.1em; }
        .payment-form {
            background: #1a1a2e;
            border: 1px solid #2d2d44;
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 30px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #e2e8f0;
        }
        .form-group input {
            width: 100%;
            padding: 12px;
            background: #0a0a1a;
            border: 1px solid #2d2d44;
            border-radius: 8px;
            color: #e2e8f0;
            font-size: 1em;
        }
        .form-group input:focus {
            outline: none;
            border-color: #7c3aed;
            box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.1);
        }
        .safety-badge {
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
            font-weight: bold;
            text-align: center;
            display: none;
        }
        .safety-badge.safest { background-color: #10b981; color: white; }
        .safety-badge.safe { background-color: #3b82f6; color: white; }
        .safety-badge.medium { background-color: #f59e0b; color: white; }
        .safety-badge.low { background-color: #ef4444; color: white; }
        .btn {
            background: linear-gradient(135deg, #7c3aed 0%, #10b981 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            width: 100%;
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(124, 58, 237, 0.3); }
        .btn:active { transform: translateY(0); }
        .info-box {
            background: rgba(59, 130, 246, 0.1);
            border-left: 4px solid #3b82f6;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>💸 BAKOME Pay v3.0</h1>
            <p>P2P Payments on Solana with Webacy Security</p>
        </div>

        <div class="payment-form">
            <h2>Send Payment</h2>
            
            <div class="form-group">
                <label>Your Wallet Address</label>
                <input type="text" id="senderAddress" placeholder="Enter your wallet address">
            </div>

            <div class="form-group">
                <label>Recipient Address</label>
                <input type="text" id="receiverAddress" placeholder="Enter recipient wallet address">
            </div>

            <div class="form-group">
                <label>Token Address</label>
                <input type="text" id="tokenAddress" placeholder="Enter token mint address">
            </div>

            <div class="form-group">
                <label>Amount</label>
                <input type="number" id="amount" placeholder="Enter amount" min="0" step="0.01">
            </div>

            <div class="info-box">
                ℹ️ Your payment will be checked with Webacy security APIs before sending
            </div>

            <div id="safetyBadge" class="safety-badge"></div>

            <button class="btn" onclick="checkSecurity()">🛡️ Check Security & Send</button>
        </div>

        <div id="results" style="display: none; background: #1a1a2e; padding: 20px; border-radius: 12px; border: 1px solid #2d2d44;">
            <h3>Security Check Results</h3>
            <div id="resultContent"></div>
        </div>
    </div>

    <script src="webacy-security.js"></script>
    <script>
        async function checkSecurity() {
            const senderAddress = document.getElementById('senderAddress').value;
            const receiverAddress = document.getElementById('receiverAddress').value;
            const tokenAddress = document.getElementById('tokenAddress').value;
            const amount = document.getElementById('amount').value;

            if (!senderAddress || !receiverAddress || !tokenAddress || !amount) {
                alert('❌ Please fill all fields');
                return;
            }

            console.log('🛡️ Checking security...');
            
            // Simulated security check
            const results = {
                senderSafe: Math.random() > 0.2,
                receiverSafe: Math.random() > 0.1,
                tokenSafe: Math.random() > 0.15,
                overallSafe: true
            };

            displayResults(results);
        }

        function displayResults(results) {
            const badge = document.getElementById('safetyBadge');
            const resultsDiv = document.getElementById('results');
            const resultContent = document.getElementById('resultContent');

            let html = '<ul>';
            html += `<li>Sender Wallet: ${results.senderSafe ? '✅ Safe' : '❌ Risky'}</li>`;
            html += `<li>Receiver Wallet: ${results.receiverSafe ? '✅ Safe' : '❌ Risky'}</li>`;
            html += `<li>Token: ${results.tokenSafe ? '✅ Safe' : '❌ Risky'}</li>`;
            html += '</ul>';

            resultContent.innerHTML = html;
            resultsDiv.style.display = 'block';

            if (results.overallSafe && results.senderSafe && results.receiverSafe && results.tokenSafe) {
                badge.textContent = '✅ SAFEST - Payment Approved';
                badge.className = 'safety-badge safest';
                badge.style.display = 'block';
            } else {
                badge.textContent = '⚠️ MEDIUM RISK - Proceed with Caution';
                badge.className = 'safety-badge medium';
                badge.style.display = 'block';
            }
        }
    </script>
</body>
</html>
